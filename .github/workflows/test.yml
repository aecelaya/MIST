# =============================================================================
# Test suite + coverage badge
#
# Runs the MIST pytest suite under coverage across every supported Python
# version. Acts as the required status check on pull requests and keeps the
# coverage badge (coverage.svg) in the repo up to date.
#
# Triggers:
#   - push to main          (badge is refreshed and committed)
#   - pull_request to main  (status check only; no commit)
#   - workflow_dispatch      (manual "Run workflow" button / `gh workflow run`)
# =============================================================================
name: Run Tests and Generate Coverage Badge

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write is required by the coverage-badge commit step below. Every
# other step only needs read access.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Install the package itself so dependencies come from pyproject.toml
    # (single source of truth — including the torch version constraint) rather
    # than a hand-maintained list that can drift. The [dev] extra brings in
    # pytest itself; only the test-time tools that aren't in either group are
    # listed explicitly.
    # setuptools<81 is required because coverage-badge imports pkg_resources,
    # which Python >= 3.12 environments no longer bundle and setuptools >= 81
    # no longer ships.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" pytest-cov coverage-badge "setuptools<81"

    # Results folders trained by older releases, for tests/compat. They're too
    # large for git, so they live on a release. Until that release exists the
    # compat tests skip; once it does, set MIST_REQUIRE_COMPAT to "1" below so
    # a missing download fails instead.
    - name: Download inference compatibility fixtures
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p tests/compat/fixtures "$RUNNER_TEMP/compat"
        if gh release download compat-fixtures-v1 --repo mist-medical/MIST \
            --pattern 'mist-compat-*.tar.gz' --dir "$RUNNER_TEMP/compat"; then
          for archive in "$RUNNER_TEMP"/compat/*.tar.gz; do
            tar -xzf "$archive" -C tests/compat/fixtures
          done
        else
          echo "No compat-fixtures-v1 release; tests/compat will skip."
        fi

    # Run the full suite under coverage. term-missing prints uncovered lines in
    # the log; the xml report feeds coverage-badge, which renders coverage.svg.
    - name: Run tests and generate coverage report
      env:
        MIST_REQUIRE_COMPAT: "0"
      run: |
        pytest --cov=mist --cov-report=term-missing --cov-report=xml
        coverage-badge -o coverage.svg -f

    # Publish the badge and commit it back only from a single matrix leg so the
    # three jobs don't collide on the artifact name or race on the git push.
    - name: Upload coverage badge
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-badge
        path: coverage.svg

    - name: Commit coverage badge to repo (optional)
      if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add coverage.svg
        # [skip ci] keeps this commit from re-triggering the workflow.
        git commit -m "chore: update coverage badge [skip ci]" || exit 0
        git push
      continue-on-error: true
